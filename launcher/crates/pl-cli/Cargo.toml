[package]
name = "pl-cli"
description = "Outil en ligne de commande pour tester le moteur du launcher PatateLand"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pl-cli"
path = "src/main.rs"

[dependencies]
pl-engine = { path = "../pl-engine" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
# Génération de la clé de signature des mises à jour.
getrandom = "0.2"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
