[workspace]
resolver = "3"
members = ["crates/pl-engine", "crates/pl-cli", "crates/pl-app", "crates/pl-setup"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true

# Le hachage SHA-1 est inutilisable en debug non optimisé.
[profile.dev.package."*"]
opt-level = 3

# Installateur : optimisé pour la taille (il ne sert qu'une fois et le
# désinstallateur en est une copie). Le launcher garde le profil release.
[profile.setup]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
