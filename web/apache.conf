# Site du serveur de fichiers PatateLand (copié dans l'image par le Dockerfile).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/public

    # Variables lues par index.php (valeurs par défaut de l'image).
    PassEnv PL_DATA_DIR PL_FILES_DIR PL_CACHE_DIR PL_PUBLIC_URL

    # Fichiers de jeu : servis par Apache sans passer par PHP (rapide, reprise
    # des téléchargements). Pas de liste des dossiers, pas de fichiers cachés.
    Alias "/files/" "/var/www/files/"
    <Directory "/var/www/files">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    # Dossiers cachés (copie en cours d'envoi, ancienne version d'un modpack).
    <DirectoryMatch "^/var/www/files/(.+/)?\.">
        Require all denied
    </DirectoryMatch>

    # Tout le reste passe par le routeur.
    <Directory "/var/www/public">
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # JSON compressé (manifests de plusieurs centaines de fichiers).
    AddOutputFilterByType DEFLATE application/json

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
