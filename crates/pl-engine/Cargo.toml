[package]
name = "pl-engine"
description = "Moteur du launcher PatateLand : téléchargements, vérification, Java, Minecraft, Forge, lancement"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util = "0.3"
hex = "0.4"
# Mises à jour : vérification de la signature du manifeste (ed25519) et des fichiers (SHA-256).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
ammonia = "4"
quick-xml = "0.37"
sha1 = "0.10"
# TLS natif Windows (Schannel) : aucune dépendance C à compiler.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "http2", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

# Secrets sur macOS et Linux (Windows utilise DPAPI).
[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
chacha20poly1305 = "0.10"
wiremock = "0.6"
tempfile = "3"
