<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Console de jeu - PatateLand</title>
    <link rel="stylesheet" href="css/console.css">
    <script type="module" src="js/console.js"></script>
</head>
<body>
    <header class="titlebar" data-tauri-drag-region>
        <div class="title" data-tauri-drag-region><img src="img/icon.png" alt="" data-tauri-drag-region> <span id="title" data-tauri-drag-region>Console</span> <span id="status" class="status">en cours</span></div>
        <div class="actions">
            <button id="copy">Copier</button>
            <button id="clear">Effacer</button>
            <button id="close" class="close" aria-label="Fermer">✕</button>
        </div>
    </header>
    <pre id="log" class="log"></pre>
</body>
</html>
