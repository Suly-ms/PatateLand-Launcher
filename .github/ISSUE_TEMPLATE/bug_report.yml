name: Signaler un bug
description: Vous avez rencontré un bug? Signalez-le ici
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
     value: |
      Un grand merci d'avance pour votre aide. Néanmoins, nous avons besoin d'un certain nombre d'informations, pour nous aider.
  - type: checkboxes
    attributes:
      label: "Vérifications avant d'envoyer le signalement"
      description: Sans ces vérifications, le signalement risque d'être fermé.
      options:
        - label: J'utilise la dernière version du launcher PatateLand
          required: true
        - label: J'ai vérifié qu'aucune issue ouverte ne signale déjà ce bug
          required: true
  - type: dropdown
    attributes:
      label: Système d'exploitation
      options:
        - Windows
        - macOS
        - Linux (Basé sur Debian/Ubuntu)
        - Linux (Autres)
    validations:
      required: true
  - type: input
    attributes:
      label: Version du système d'exploitation
      placeholder: "Exemple: Windows 11 Professionnel 21H2 Build 22000.739"
    validations:
        required: true
  - type: input
    attributes:
      label: Version du launcher
      description: Paramètres du launcher, ou nom du fichier d'installation
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Instance concernée
      options:
        - Opti
        - Extra
        - Event
        - Aucune (le launcher lui-même)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Comportement attendu
      description: Une description de ce qui devrait se passer
      placeholder: Le launcher devrait...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Comportement actuel
      description: Une description de ce qui se passe avec le bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Étapes pour reproduire le bug
      placeholder: |
        1. Ouvrir le launcher
        2. Aller dans le menu xyz
        3. Cliquer sur abc
        4. Observer
    validations:
      required: true
  - type: textarea
    attributes:
      label: Journaux et notes
      description: |
        Journal du launcher : %APPDATA%\PatateLand-Rust\logs\launcher.log (Windows),
        ~/.local/share/PatateLand-Rust/logs/launcher.log (Linux). Rapport de crash Minecraft si le jeu a planté.
      placeholder: Glissez les fichiers ici, ou collez les lignes utiles
    validations:
      required: false
